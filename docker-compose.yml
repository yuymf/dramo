services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: dramo
      POSTGRES_USER: dramo
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dramo_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dramo -d dramo"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - dramo-network

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 12321
      DATABASE_URL: postgresql://dramo:${DB_PASSWORD:-dramo_secret}@postgres:5432/dramo
      STORAGE_DRIVER: local
      STORAGE_LOCAL_DIR: /app/uploads
      STORAGE_BASE_URL: ${PUBLIC_URL:-http://localhost}/uploads
      AGENTOS_BASE_URL: http://agentos:12322
      AGENTOS_SECURITY_KEY: ${AGENTOS_KEY:-default_agentos_key}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      FRONTEND_URL: ${PUBLIC_URL:-http://localhost}
    volumes:
      - uploads:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:12321/api/v1/health"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - dramo-network

  agentos:
    build:
      context: ./agentos
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      PORT: 12322
      AGENTOS_SECURITY_KEY: ${AGENTOS_KEY:-default_agentos_key}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:12322/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - dramo-network

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /api
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_URL: /api
      BACKEND_API_URL: http://api:12321
    networks:
      - dramo-network

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${PORT:-80}:80"
    depends_on:
      - web
      - api
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - uploads:/var/www/uploads:ro
    networks:
      - dramo-network

volumes:
  postgres_data:
  uploads:

networks:
  dramo-network:
    driver: bridge
