name: CI

# Runs on Grok Bot box self-hosted runners (hosted minutes billing-blocked).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: dramo-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: [self-hosted, linux, X64, box]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install npm dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

  test:
    name: Server unit tests
    runs-on: [self-hosted, linux, X64, box]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install npm dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Install ffmpeg
        run: |
          if command -v ffmpeg >/dev/null 2>&1; then
            ffmpeg -version | head -1
            exit 0
          fi
          if command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then
            sudo apt-get update && sudo apt-get install -y ffmpeg
          else
            echo "::error::ffmpeg missing and sudo apt unavailable on this runner"
            exit 1
          fi

      - name: Run server Jest
        run: npm run test

  agentos-pytest:
    name: AgentOS pytest
    runs-on: [self-hosted, linux, X64, box]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # setup-python prebuilt 3.11 is unavailable on this Debian 13 box OS.
      # Use system python3 (3.13+) with a venv so we do not touch the box site-packages.
      - name: Install AgentOS dependencies (system python3)
        working-directory: agentos
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt -r requirements-dev.txt

      - name: Run pytest
        working-directory: agentos
        run: .venv/bin/pytest
