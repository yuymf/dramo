# Use Docker's internal DNS with 10s TTL — re-resolves when containers restart
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

server {
    listen 80;
    server_name _;

    # 动态解析：用变量存储 upstream 地址，nginx 会按 resolver TTL 重新解析
    set $web_upstream http://web:3000;
    set $api_upstream http://api:12321;

    # 后端 API + SSE（必须在 / 之前匹配）
    location /api/ {
        # Rewrite /api/xxx → /api/v1/xxx (skip if already /api/v1/)
        rewrite ^/api/(?!v1/)(.*)$ /api/v1/$1 break;

        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 长连接支持（分镜生成最长 9 分钟 + SSE 流式）
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        # SSE 必须关闭缓冲
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection "";
    }

    # Serve uploaded images directly (shared Docker volume)
    location /uploads/ {
        alias /var/www/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 前端页面
    location / {
        proxy_pass $web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Next.js WebSocket (HMR)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
